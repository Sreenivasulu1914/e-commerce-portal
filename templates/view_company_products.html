{% extends "base.html" %}

{% block title %}Company Products{% endblock %}

{% block content %}
    <h1 class="text-center mb-4 head_of_page">Products</h1>

    <!-- Products -->
    <div class="container mt-5">
        <div class="row">
            {% for product in products %}
            <div class="col-md-3 mb-4">
                <div class="card">
                    <img src="{{ url_for('static', filename='upload/' + product.image) }}" class="card-img-top" alt="{{ product.product_name }}">
                    <div class="card-body">
                        <h5 class="card-title">{{ product.product_name }}</h5>
                        <p class="card-text">{{ product.description }}</p>
                        <p class="card-text"><strong>Price:</strong> &#8377;{{ product.cost }}</p>
                        <a href="{{ url_for('view_product', product_id=product.product_id) }}" class="btn btn-primary">View Product</a>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
{% endblock %}
