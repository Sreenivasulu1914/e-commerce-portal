<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        const add = (a, b) => {
            return a + b;
        }
        b = add(32, 23)
        console.log(b);
        function addition(a, b) {
            return a + b;
        }

        add(76, 89);
        const c = addition(768, 768);
        console.log(c);


        var a = "22bc";
        var b = 23;
        var d = a + b;
        console.log(d);



        console.log("===============");
        console.log("=== Valid Case ===");

        var p = "20ab";  // Starts with number
        var q = 40;
        var r = parseInt(p) + q;

        console.log(r);  // Output: 60 (because parseInt("20ab") = 20)



        console.log("=== Invalid Case ===");

        var p = "ab20";  // Starts with letters
        var q = 40;
        var r = parseInt(p) + q;

        console.log(r);  // Output: NaN (because parseInt("ab20") = NaN)





    </script>




    <div>
        <h1>JavaScript</h1>


        <audio style="background-color: red;">
            My name is sreenivas
        </audio>
    </div>




    <form method="get" class="form1">
        <label for="name">Name </label>
        <input type=" text" id="name" name="fname" value="">
        <label for="pwd">Password</label>
        <input id="pwd" name="pwd" type="password">
        <input type="submit" value="Submit">
        <button type="reset">reset</button>
    </form>

    <style>
        @media(orientation:landscape) {
            body {
                background-color: red;
            }

        }

        @media (orientation: portrait) {

            /* Styles for portrait orientation */
            body {
                background-color: green;
            }
        }
    </style>
    <div class="fade-in">Hello!</div>


    <style>
        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(90deg);
            }
        }

        .rotate {
            animation: rotate 2s linear infinite;
        }
    </style>

</body>
