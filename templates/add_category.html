{% extends "base.html" %}

{% block title %}Add Categories{% endblock %}

{% block content %}

    <h2 class="head_of_page">Add Category</h2>
    <!-- Add Category Form -->
    <div class="container mt-5">
       
        <form action="{{ url_for('edit_category', category_id=category['category_id']) if category else url_for('add_category') }}" method="post" enctype="multipart/form-data">
            <div class="form-group">
                <label for="category_type">Category Type</label>
                <input type="text" class="form-control" id="category_type" name="category_type" value="{{ category['category_type'] if category else '' }}" required>
            </div>
            <div class="form-group">
                <label for="description">Description</label>
                <textarea class="form-control" id="description" name="description" rows="4" required>{{ category['description'] if category else '' }}</textarea>
            </div>
            <div class="form-group">
                <label for="image">Image</label>
                <input type="file" class="form-control-file" id="image" name="image" {% if not category %}required{% endif %}>
            </div>
            <button type="submit" class="btn btn-primary">{{ 'Update Category' if category else 'Add Category' }}</button>
        </form>
    </div>

    {% endblock %}
