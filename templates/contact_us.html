

{% extends "base.html" %}

{% block title %}Contact Us {% endblock %}

{% block content %}
        <h2 class="head_of_page">Contact US</h2>
    <!-- Contact Us Section -->
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-6">
                <h2>Get in Touch with Us</h2>
                <p><strong>Phone:</strong> 7680901559</p>
                <p><strong>Email:</strong> info@ecommerce.com</p>
                <p><strong>Address:</strong> 123 E-Commerce St, Online City, Web</p>
                <h3>Social Network</h3>
                <a href="#" class="m-2"><i class="bi bi-facebook"></i></a>
                <a href="#"><i class="bi bi-twitter-x m-2"></i></a>
                <a href="#"><i class="bi bi-instagram m-2"></i></a>
                <a href="#"><i class="bi bi-linkedin m-2"></i></a>
            </div>
            <div class="col-md-6">
                <h2>Our Location</h2>
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3806.089935938003!2d77.8022833153167!3d14.16501397975195!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3bb6d1b1f5b1f5b1%3A0xf577d1b1f5b1f5b1!2sPuttaparthi%2C%20Andhra%20Pradesh%2C%20India!5e0!3m2!1sen!2sus!4v1633072800000!5m2!1sen!2sus" width="100%" height="400" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
            </div>
        </div>
        <div class="row mt-5">
            <div class="col-md-12">
                <h2>Contact Us</h2>
                <form action="{{ url_for('contact_us') }}" method="post">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" class="form-control" id="name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="subject">Subject</label>
                        <input type="text" class="form-control" id="subject" name="subject" required>
                    </div>
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea class="form-control" id="message" name="message" rows="4" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Send Message</button>
                </form>
            </div>
        </div>
    </div>

{% endblock %}
