{% extends "base.html" %}

{% block title %}Place Order{% endblock %}

{% block content %}
<h2 class="head_of_page">Place Order</h2>
<div class="container mt-5">
    <div class="alert alert-info">
        Total Amount to be Paid: &#8377;{{ total_amount }}
    </div>
    <form action="{{ url_for('process_payment') }}" method="post">
        <div class="form-group">
            <label for="card_number">Card Number</label>
            <input type="text" class="form-control" id="card_number" name="card_number" required>
        </div>
        <div class="form-group">
            <label for="name_on_card">Name on Card</label>
            <input type="text" class="form-control" id="name_on_card" name="name_on_card" required>
        </div>
        <div class="form-group">
            <label for="card_type">Card Type</label>
            <select class="form-control" id="card_type" name="card_type" required>
                <option value="Visa">Visa</option>
                <option value="MasterCard">MasterCard</option>
                <option value="American Express">American Express</option>
            </select>
        </div>
        <div class="form-group">
            <label for="card_expiry">Card Expiry</label>
            <input type="text" class="form-control" id="card_expiry" name="card_expiry" placeholder="MM/YY" required>
        </div>
        <div class="form-group">
            <label for="cvv">CVV</label>
            <input type="text" class="form-control" id="cvv" name="cvv" required>
        </div>
        <div class="form-group">
            <label for="total_amount">Total Amount</label>
            <input type="text" class="form-control" id="total_amount" name="total_amount" value="{{ total_amount }}" readonly>
        </div>
        <button type="submit" class="btn btn-primary">Make Payment</button>
    </form>
</div>
{% endblock %}
