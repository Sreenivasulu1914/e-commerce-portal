{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}


<h2 class="head_of_page">Login</h2>

<div class="container mt-5">
    <h2>Login</h2>
    <form action="{{ url_for('login') }}" method="post" id="loginForm">
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" class="form-control" id="email" name="email" required>
        </div>
        <div class="h-captcha" data-sitekey="4022e212-f2b6-4c02-a7b8-3e96859af90c"></div> Replace with your actual Site Key
        <button type="submit" class="btn btn-primary">Send OTP</button>
    </form>
    <div>
      You Don't have any account ?  <a href="{{ url_for('register') }}">Sign up</a>
    </div>
</div>

<script src="https://hcaptcha.com/1/api.js" async defer></script>



{% endblock %}
