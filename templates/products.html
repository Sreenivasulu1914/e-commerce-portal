{% extends "base.html" %}

{% block title %}Products - E-Commerce Portal{% endblock %}

{% block content %}
<!-- Header: Bold and scalable -->
<section class="bg-light py-4">
    <div class="container">
        <h1 class="display-5 fw-bold animate__animated animate__fadeIn">
            <i class="fas fa-shopping-bag me-2 text-primary"></i> All Products
        </h1>
        <p class="lead">Explore our curated collection of top-quality items.</p>
    </div>
</section>

<!-- Search and Filters -->
<section class="container my-4">
    <div class="row g-3 align-items-center">
        <div class="col-md-6">
            <form id="searchForm" class="d-flex">
                <input class="form-control me-2" type="search" placeholder="Search products..." aria-label="Search" id="searchInput">
                <button class="btn btn-primary" type="submit">
                    <i class="fas fa-search me-1"></i> Search
                </button>
                <button class="btn btn-outline-secondary ms-2" type="reset" id="resetSearch">Reset</button>
            </form>
        </div>
        <div class="col-md-6">
            <div class="d-flex align-items-center">
                <label for="categoryFilter" class="me-2">Filter by Category:</label>
                <select id="categoryFilter" class="form-select w-auto">
                    <option value="">All Categories</option>
                    <!-- Populated dynamically -->
                </select>
                <span class="ms-3 text-muted" id="productCount">0 products</span>
            </div>
        </div>
    </div>
</section>

<!-- Products Section -->
<section class="container my-5">
    <div class="row" id="product-cards">
        <!-- Product cards go here -->
    </div>
    <div id="no-products-message" class="alert alert-info text-center d-none">
        <i class="fas fa-info-circle me-2"></i> No products found. Try another search or category!
    </div>
    <div id="loading-spinner" class="text-center d-none">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>
</section>

<!-- JavaScript -->
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const productCardsContainer = document.getElementById('product-cards');
        const noProductsMessage = document.getElementById('no-products-message');
        const loadingSpinner = document.getElementById('loading-spinner');
        const productCount = document.getElementById('productCount');
        const categoryFilter = document.getElementById('categoryFilter');

        // Fetch categories
        fetch('/api/categories')
            .then(response => {
                if (!response.ok) throw new Error('Failed to fetch categories');
                return response.json();
            })
            .then(categories => {
                if (categories.error) throw new Error(categories.error);
                categories.forEach(category => {
                    const option = document.createElement('option');
                    option.value = category.category_id;
                    option.textContent = category.category_name;
                    categoryFilter.appendChild(option);
                });
            })
            .catch(error => {
                console.error('Error fetching categories:', error);
                categoryFilter.innerHTML = '<option value="">Categories unavailable</option>';
            });

        // Fetch products
        const fetchProducts = (query = '', category = '') => {
            loadingSpinner.classList.remove('d-none');
            productCardsContainer.innerHTML = '';
            noProductsMessage.classList.add('d-none');

            const url = new URL('{{ url_for("api_products") }}', window.location.origin);
            if (query) url.searchParams.append('search', query);
            if (category) url.searchParams.append('category', category);

            fetch(url)
                .then(response => {
                    if (!response.ok) throw new Error('Failed to fetch products');
                    return response.json();
                })
                .then(products => {
                    loadingSpinner.classList.add('d-none');
                    productCount.textContent = `${products.length} product${products.length !== 1 ? 's' : ''}`;

                    if (products.length === 0) {
                        noProductsMessage.classList.remove('d-none');
                        return;
                    }

                    products.forEach((product, index) => {
                        const productCard = document.createElement('div');
                        productCard.className = 'col-md-3 mb-4 animate__animated animate__fadeInUp';
                        productCard.style.animationDelay = `${index * 0.1}s`;
                        productCard.innerHTML = `
                            <div class="card h-100 shadow-sm hover-scale">
                                <img src="{{ url_for('static', filename='upload/') }}${product.image || 'default.jpg'}" class="card-img-top" alt="${product.product_name}" style="height: 200px; object-fit: cover;">
                                <div class="card-body d-flex flex-column">
                                    <h5 class="card-title">${product.product_name}</h5>
                                    <p class="card-text text-muted flex-grow-1">${product.description.length > 80 ? product.description.substring(0, 77) + '...' : product.description}</p>
                                    <a href="/view_product/${product.product_id}" class="btn btn-primary btn-view-product mt-auto">
                                        <i class="fas fa-eye me-1"></i> View Product
                                    </a>
                                </div>
                            </div>
                        `;
                        productCardsContainer.appendChild(productCard);
                    });
                })
                .catch(error => {
                    loadingSpinner.classList.add('d-none');
                    noProductsMessage.classList.remove('d-none');
                    console.error('Error fetching products:', error);
                });
        };

        // Initial fetch
        fetchProducts();

        // Search form
        document.getElementById('searchForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const query = document.getElementById('searchInput').value;
            const category = categoryFilter.value;
            fetchProducts(query, category);
        });

        // Reset search
        document.getElementById('resetSearch').addEventListener('click', function() {
            document.getElementById('searchInput').value = '';
            categoryFilter.value = '';
            fetchProducts();
        });

        // Category filter
        categoryFilter.addEventListener('change', function() {
            const query = document.getElementById('searchInput').value;
            const category = this.value;
            fetchProducts(query, category);
        });
    });
</script>

<style>
    /* Dropdown Fix */
    #categoryFilter,
    #categoryFilter option {
        color: #000 !important; /* Black text for dropdown and options */
    }

    /* Hover Effects */
    .hover-scale {
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .hover-scale:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
    }

    /* Card Image */
    .card-img-top {
        transition: transform 0.3s ease;
    }
    .card-img-top:hover {
        transform: scale(1.05);
    }

    /* Search Input */
    .form-control:focus {
        border-color: #007bff;
        box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
    }

    /* Card Alignment */
    .card-body {
        display: flex;
        flex-direction: column;
    }
    .btn-view-product {
        margin-top: auto;
    }

    /* Responsive */
    @media (max-width: 768px) {
        .display-5 {
            font-size: 2rem;
        }
        .col-md-3 {
            flex: 0 0 50%;
            max-width: 50%;
        }
    }
    select, select option {
    color: #000 !important;
}
</style>
{% endblock %}
