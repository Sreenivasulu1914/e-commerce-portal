{% extends "base.html" %}

{% block title %}About Us{% endblock %}

{% block content %}


    <h2 class="head_of_page"> Product Details</h2>
    <!-- Product Details -->
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-6">
                <img src="{{ url_for('static', filename='upload/' + product['image']) }}" class="img-fluid" alt="{{ product['product_name'] }}">
            </div>
            <div class="col-md-6">
                <h2>{{ product['product_name'] }}</h2>
                <p><strong>Brand:</strong> {{ product['brand'] }}</p>
                <p><strong>Price:</strong> &#8377;{{ product['cost'] }}</p>
                <!-- <p><strong>Color:</strong> {{ product['color'] }}</p> -->
                <!-- <p><strong>Company:</strong> {{ product['company'] }}</p> -->
                <p><strong>Category:</strong> {{ product['category'] }}</p>
                <p><strong>Description:</strong> {{ product['description'] }}</p>
                <form action="{{ url_for('add_to_cart', product_id=product['product_id']) }}" method="post">
                    <button type="submit" class="btn btn-primary">Add to Cart</button>
                </form>
            </div>
        </div>
    </div>
    
   
                        <script>
        document.getElementById('add-to-cart').addEventListener('click', function() {
            const product = {
                id: "{{ product['product_id'] }}",
                image: "{{ product['image'] }}",
                name: "{{ product['product_name'] }}",
                cost : "{{ product['cost'] }}",
                quantity : 1
            };
    
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            const existingProductIndex = cart.findIndex(item => item.id === product.id);
    
            if (existingProductIndex !== -1) {
                cart[existingProductIndex].quantity += 1;
            } else {
                cart.push(product);
            }
    
            localStorage.setItem('cart', JSON.stringify(cart));
            alert('Product added to cart!');
        });
    </script>

{% endblock %}
